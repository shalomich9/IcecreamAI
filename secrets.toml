   Каждая ветвь имеет параметры:
   — УРОВЕНЬ РАЗРУШЕНИЯ (0-100%, где 100% — полный коллапс)
   — ТИП (Механическая, Органическая, Эфирная, Гибридная, Мёртвая)
   — ЗАКОНЫ ФИЗИКИ (гравитация, время, пространство, причинность)
   — ОБИТАТЕЛИ (Оставшиеся, Пришельцы, Пустые, Хранители, Паразиты)
